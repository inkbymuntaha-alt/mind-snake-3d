name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot 4.7.2
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Download matching export templates
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o "$HOME/godot/templates.tpz"
          mkdir -p "$HOME/godot/template_unpack"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/template_unpack"
          cp -R "$HOME/godot/template_unpack/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Validate project and import resources
        run: |
          GODOT="$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --editor --path . --quit

      - name: Headless runtime smoke test
        run: |
          GODOT="$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --quit-after 3

      - name: Export debug APK
        run: |
          mkdir -p build
          GODOT="$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --export-debug "Android" build/MindSnake-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mind-Snake-3D-Android-APK
          path: build/MindSnake-debug.apk
          if-no-files-found: error
          retention-days: 14
